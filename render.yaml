# Render Blueprint — API + PostgreSQL for HOLYDJO MARKET (staging).
# Render dashboard → New → Blueprint → pick this repository.
# Values marked `sync: false` are asked for when the blueprint is created.
databases:
  - name: holydo-db
    plan: free            # free Postgres expires after 30 days — upgrade before real launch
    databaseName: holydo_market

services:
  - type: web
    name: holydo-api
    runtime: node
    rootDir: backend
    plan: free            # free instances sleep when idle (first request takes ~1 min)
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Apply pending database migrations, then start the API.
    startCommand: npx prisma migrate deploy && node dist/main
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY      # Render's load balancer: real client IP for rate limiting
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: holydo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL     # e.g. https://holydo-market.vercel.app
        sync: false
      - key: APP_URL          # same as FRONTEND_URL (used in email links)
        sync: false
      - key: SMTP_URL         # e.g. smtps://resend:API_KEY@smtp.resend.com:465
        sync: false
      - key: MAIL_FROM        # e.g. HOLYDJO MARKET <onboarding@resend.dev>
        sync: false
      - key: CLOUDINARY_URL   # cloudinary://API_KEY:API_SECRET@CLOUD_NAME
        sync: false
