# Keeps the Render free API awake (audit H3): Render puts free services to
# sleep after 15 minutes without traffic, and the next visitor then waits
# ~40 seconds. This job calls /health every 10 minutes.
#
# - Free for public repositories (GitHub Actions minutes are unlimited).
# - Render's free plan includes 750 h/month: enough for one service awake 24/7.
# - GitHub may delay scheduled runs a little, and disables them after 60 days
#   without any commit: re-enable from the Actions tab if needed.
# - Once the API is on a paid Render plan (no sleep), delete this file.
#
# Optional: set the repository variable API_HEALTH_URL (Settings → Secrets and
# variables → Actions → Variables) if the API address changes.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.API_HEALTH_URL || 'https://holydo-api.onrender.com/health' }}
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 "$URL"; then echo; echo "API awake"; exit 0; fi
            echo "attempt $i failed, retrying in 20 s"; sleep 20
          done
          echo "::warning::API did not answer at $URL"
